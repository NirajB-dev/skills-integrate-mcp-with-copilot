<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="branch-background" aria-hidden="true"></div>

    <header>
      <div class="admin-corner">
        <button id="user-menu-btn" class="icon-btn" type="button" aria-label="User menu">👤</button>
        <div id="admin-panel" class="admin-panel hidden">
          <p id="admin-status">Student mode</p>
          <button id="login-btn" type="button">Log In</button>
          <button id="logout-btn" class="hidden" type="button">Log Out</button>
        </div>
      </div>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <div id="login-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="login-title">
      <div class="modal-content">
        <h3 id="login-title">Teacher Login</h3>
        <form id="login-form">
          <div class="form-group">
            <label for="teacher-username">Username:</label>
            <input id="teacher-username" type="text" required />
          </div>
          <div class="form-group">
            <label for="teacher-password">Password:</label>
            <input id="teacher-password" type="password" required />
          </div>
          <div class="modal-actions">
            <button type="submit">Log In</button>
            <button id="cancel-login-btn" type="button">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <main>
      <section id="mascots-container">
        <h3>School Mascot Squad</h3>
        <div class="mascot-grid">
          <a class="mascot-card" href="https://octodex.github.com/" target="_blank" rel="noopener noreferrer">
            <img src="https://octodex.github.com/images/daftpunktocat-guy.gif" alt="Daftpunktocat" loading="lazy" />
            <p>Daftpunktocat</p>
          </a>
          <a class="mascot-card" href="https://octodex.github.com/" target="_blank" rel="noopener noreferrer">
            <img src="https://octodex.github.com/images/minion.png" alt="Minion" loading="lazy" />
            <p>Minion</p>
          </a>
          <a class="mascot-card" href="https://octodex.github.com/" target="_blank" rel="noopener noreferrer">
            <img src="https://octodex.github.com/images/nyantocat.gif" alt="Nyantocat" loading="lazy" />
            <p>Nyantocat</p>
          </a>
          <a class="mascot-card" href="https://octodex.github.com/" target="_blank" rel="noopener noreferrer">
            <img src="https://octodex.github.com/images/spidertocat.png" alt="Spidertocat" loading="lazy" />
            <p>Spidertocat</p>
          </a>
        </div>
      </section>

      <section id="activities-container">
        <h3>Available Activities</h3>
        <div class="activity-toolbar" aria-label="Activity controls">
          <div class="toolbar-group toolbar-search">
            <label for="search-input">Search</label>
            <input id="search-input" type="text" placeholder="Search by name or description" />
          </div>
          <div class="toolbar-group">
            <label for="category-filter">Category</label>
            <select id="category-filter">
              <option value="all">All categories</option>
            </select>
          </div>
          <div class="toolbar-group">
            <label for="sort-by">Sort by</label>
            <select id="sort-by">
              <option value="name">Name (A-Z)</option>
              <option value="time">Start time (earliest)</option>
            </select>
          </div>
        </div>
        <div id="message" class="hidden"></div>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
