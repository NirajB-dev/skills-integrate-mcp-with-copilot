<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="branch-background" aria-hidden="true"></div>

    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>

      <section id="mascots-container">
        <h3>School Mascot Squad</h3>
        <div class="mascot-grid">
          <a class="mascot-card" href="https://octodex.github.com/" target="_blank" rel="noopener noreferrer">
            <img src="https://octodex.github.com/images/daftpunktocat-guy.gif" alt="Daftpunktocat" loading="lazy" />
            <p>Daftpunktocat</p>
          </a>
          <a class="mascot-card" href="https://octodex.github.com/" target="_blank" rel="noopener noreferrer">
            <img src="https://octodex.github.com/images/minion.png" alt="Minion" loading="lazy" />
            <p>Minion</p>
          </a>
          <a class="mascot-card" href="https://octodex.github.com/" target="_blank" rel="noopener noreferrer">
            <img src="https://octodex.github.com/images/nyantocat.gif" alt="Nyantocat" loading="lazy" />
            <p>Nyantocat</p>
          </a>
          <a class="mascot-card" href="https://octodex.github.com/" target="_blank" rel="noopener noreferrer">
            <img src="https://octodex.github.com/images/spidertocat.png" alt="Spidertocat" loading="lazy" />
            <p>Spidertocat</p>
          </a>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
